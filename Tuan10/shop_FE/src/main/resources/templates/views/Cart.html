<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng</title>
    <th:block th:replace="~{views/components/Navbar :: navbar-style}"></th:block>
    <th:block th:replace="~{views/components/Navbar :: navbar-script}"></th:block>
    <link rel="stylesheet" th:href="@{/css/cart.css}">
</head>
<body>
    <div th:replace="~{views/components/Navbar :: navbar}"></div>
    
    <div class="container-cart">
        <h1>Giỏ hàng của tôi</h1>

        <div th:if="${error != null}" class="error-message">
            <strong>Lỗi:</strong> <span th:text="${error}"></span>
        </div>

        <div th:if="${success != null}" class="success-message">
            <span th:text="${success}"></span>
        </div>

        <div th:if="${cartItems != null && !cartItems.isEmpty()}" class="cart-content">
            <div class="cart-items">
                <div th:each="item : ${cartItems}" class="cart-item">
                    <div class="item-image">
                        <a th:href="@{/products/{id}(id=${item.productId})}">
                            <img th:if="${item.productImageURL != null && !item.productImageURL.isEmpty()}" 
                                 th:src="${item.productImageURL}" 
                                 th:alt="${item.productName}"
                                 onerror="this.onerror=null; this.style.display='none'; this.nextElementSibling.style.display='flex';">
                            <div class="no-image-placeholder" style="display: none;">
                                <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                    <polyline points="21 15 16 10 5 21"></polyline>
                                </svg>
                            </div>
                            <div th:if="${item.productImageURL == null || item.productImageURL.isEmpty()}" class="no-image-placeholder">
                                <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                    <polyline points="21 15 16 10 5 21"></polyline>
                                </svg>
                            </div>
                        </a>
                    </div>
                    <div class="item-info">
                        <a th:href="@{/products/{id}(id=${item.productId})}" class="item-name" th:text="${item.productName}"></a>
                        <div class="item-price">Giá: <span th:text="${#numbers.formatDecimal(item.price, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span></div>
                        <div class="item-quantity">Số lượng: <span th:text="${item.quantity}"></span></div>
                    </div>
                    <div class="item-subtotal">
                        <div class="subtotal-label">Thành tiền</div>
                        <div class="subtotal-value" th:text="${#numbers.formatDecimal(item.subtotal, 0, 'COMMA', 0, 'POINT')} + ' đ'"></div>
                    </div>
                </div>
            </div>

            <div class="cart-summary">
                <div class="summary-row">
                    <span>Tổng số sản phẩm:</span>
                    <span th:text="${totalItems}"></span>
                </div>
                <div class="summary-row total">
                    <span>Tổng thanh toán:</span>
                    <span class="total-price" th:text="${#numbers.formatDecimal(totalPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
                </div>
                <div class="cart-actions">
                    <a th:href="@{/}" class="btn-continue-shopping">Tiếp tục mua sắm</a>
                    <button class="btn-checkout" onclick="alert('Chức năng thanh toán đang được phát triển')">Thanh toán</button>
                </div>
            </div>
        </div>

        <div th:if="${cartItems == null || cartItems.isEmpty()}" class="empty-cart">
            <svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="9" cy="21" r="1"></circle>
                <circle cx="20" cy="21" r="1"></circle>
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            </svg>
            <h2>Giỏ hàng trống</h2>
            <p>Bạn chưa có sản phẩm nào trong giỏ hàng</p>
            <a th:href="@{/}" class="btn-continue-shopping">Tiếp tục mua sắm</a>
        </div>
    </div>
</body>
</html>
